# 训练和测试数据集路径配置，与NDP迁移学习保持一致
train_csv_paths:
  - datasets/processed/train_111801.csv
  - datasets/processed/train_468101.csv
test_csv_path: datasets/processed/train_2304601.csv

# 基线模型参数
linear_fit_intercept: true

svr_kernel: rbf
svr_C: 1.0
svr_epsilon: 0.1
svr_gamma: scale

# 保存和可视化设置
save_dir: results/transfer_baselines
visualize: true
show_residual: true

# NDP迁移学习结果路径，用于性能对比
ndp_transfer_results: results/transfer/transfer_results.txt

# 随机种子
seed: 42